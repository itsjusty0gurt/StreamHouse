services:
  - type: web
    # This intentionally creates the modern service alongside the legacy service.
    # Complete docs/deployment/relay-brand-migration.md before attaching production.
    name: streamhouse-soundboard-relay
    runtime: python
    plan: free
    buildCommand: python -m compileall extensions/twitch/app
    startCommand: python -m extensions.twitch.app.relay_server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TWITCH_EXTENSION_SECRET
        sync: false
      - key: STREAMHOUSE_RELAY_KEYS
        sync: false
      # Set this explicitly only after choosing and completing the database
      # copy/shared-storage strategy. Never point a new service at an empty path.
      - key: STREAMHOUSE_RELAY_DB
        sync: false
