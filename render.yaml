services:
  - type: web
    name: sally-soundboard-relay
    runtime: python
    plan: free
    buildCommand: python -m compileall twitch_extension
    startCommand: python -m twitch_extension.relay_server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TWITCH_EXTENSION_SECRET
        sync: false
      - key: SALLY_RELAY_KEYS
        sync: false
      - key: SALLY_RELAY_DB
        value: /tmp/sally-soundboard-relay.sqlite3
