<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Streamhouse Soundboard Setup</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: #18181b; color: #efeff1; }
    main { max-width: 560px; margin: 0 auto; padding: 18px; border: 1px solid #45454b;
      border-radius: 8px; background: #242428; }
    h1 { margin-top: 0; color: #00d47b; font-size: 24px; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Streamhouse Soundboard</h1>
    <p>Configure pages, sound buttons, routines, and the hosted relay from the
      <strong>Your Channel &gt; Soundboard</strong> tab in Streamhouse Hub.</p>
    <p>Streamhouse Hub must be open and connected to the hosted relay for viewer buttons
      to trigger stream automation.</p>
  </main>
</body>
