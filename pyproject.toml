[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamhouse-monorepo"
version = "0.1.0"
description = "Streamhouse Hub, Streamhouse AI, shared contracts, and Twitch Extension"
requires-python = ">=3.13"
dependencies = ["PySide6==6.11.1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]
test = ["pytest>=8"]

[project.scripts]
streamhouse-hub = "products.hub.hub_main:main"
streamhouse-ai = "products.ai.ai_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["products*", "shared*", "extensions*", "tools*"]
exclude = ["tests*", "build*", "dist*", "release*"]

[tool.pytest.ini_options]
testpaths = [
  "products/hub/tests",
  "products/ai/tests",
  "shared/tests",
  "tests/integration",
  "tests/release",
]
